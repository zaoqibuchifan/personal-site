      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;

  function fmt(sec) {

  function speak(word) {

  function renderBoard() {

      var s = document.createElement('button');

    tryPair();

  function onClickZh(idx, el) {

  function tryPair() {

  function pauseGame() {

    resultTitle.textContent = win ? '🎉 游戏成功！' : '游戏失败';
    resultScore.textContent = win
      ? '得分：' + score + ' 分，全部 ' + total + ' 个单词已消除！'
      : '得分：' + score + ' 分（已消除 ' + matched + '/' + total + '）';
    overlay.hidden = false;
  }

  startBtn.addEventListener('click', function () {
    if (!running) {
      if (timer) { /* 暂停后继续 */ running = true; runTimer(); stateText.textContent = '进行中'; startBtn.textContent = '暂停'; }
      else { startGame(); }
    } else { pauseGame(); }
  });

  restartBtn.addEventListener('click', function () { startGame(); });
  againBtn.addEventListener('click', function () { overlay.hidden = true; startGame(); });

  /* 上传词表：支持 CSV/文本（逗号或 Tab 分隔）与 xlsx/xls（xlsx 解析库按需联网加载） */
  var xlsxLib = null;
  function loadXLSXLib(cb) {
    if (typeof XLSX !== 'undefined') { cb(); return; }
    if (xlsxLib) { xlsxLib.onload = cb; return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = function () { xlsxLib = null; cb(); };
    s.onerror = function () { xlsxLib = null; alert('xlsx 解析库加载失败（需联网）。可将文件另存为 CSV 后再上传。'); };
    xlsxLib = s;
    document.head.appendChild(s);
  }

  function parseDelimited(text) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    var pairs = [];
    for (var i = 0; i < lines.length; i++) {
      var parts = lines[i].split(/\t|,/);
      if (parts.length >= 2 && parts[0].trim() && parts[1].trim()) {
        pairs.push([parts[0].trim(), parts.slice(1).join(' ').trim()]);
      }
    }
    return pairs;
  }

  fileInput.addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var name = file.name.toLowerCase();
    var done = function (pairs) {
      if (!pairs.length) { alert('未能从文件中读取到单词数据，请确保第一列为单词、第二列为中文释义。'); return; }
      library = pairs;
      libLabel.textContent = '自定义词库（' + pairs.length + ' 词）';
      libSelect.disabled = true;
      if (timer) { clearInterval(timer); timer = null; }
      startGame();
    };
    if (name.indexOf('.xlsx') > -1 || name.indexOf('.xls') > -1) {
      loadXLSXLib(function () {
        var r1 = new FileReader();
        r1.onload = function (ev) {
          try {
            var wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
            var pairs = [];
            for (var i = 0; i < rows.length; i++) {
              var row = rows[i];
              if (!row || row.length < 2) continue;
              var w = String(row[0] || '').trim(), m = String(row[1] || '').trim();
              if (w && m) pairs.push([w, m]);
            }
            done(pairs);
          } catch (err) { alert('xlsx 解析失败：' + err.message); }
        };
        r1.readAsArrayBuffer(file);
      });
    } else {
      var r2 = new FileReader();
      r2.onload = function (ev) { done(parseDelimited(ev.target.result)); };
      r2.readAsText(file, 'utf-8');
    }
    e.target.value = '';
  });
})();
</script>
</body>
</html>
